<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Gerenciar Cardápio</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 10px; max-width: 400px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .switch-container { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
    .switch-container input { width: 22px; height: 22px; cursor: pointer; }
    .status { margin-top: 15px; font-weight: bold; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2> Painel Administrativo</h2>
    <hr>
    <div class="switch-container">
      <label for="toggleBebidas"><strong>Disponibilizar Bebidas:</strong></label>
      <input type="checkbox" id="toggleBebidas">
    </div>
    <div id="statusMsg" class="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ COLE AQUI AS SUAS CREDENCIAIS DO FIREBASE CONSOLE
    const firebaseConfig = {
  apiKey: "AIzaSyCHQhXMtPfkD9j4KCJPPjgk1c_eRZe3WHA",
  authDomain: "churrasco-bom-sabor.firebaseapp.com",
  projectId: "churrasco-bom-sabor",
  storageBucket: "churrasco-bom-sabor.firebasestorage.app",
  messagingSenderId: "608833389532",
  appId: "1:608833389532:web:3cfed1e270553cc9030519"
};


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const bebidasRef = ref(db, 'configuracoes/bebidasAtivas');

    const checkbox = document.getElementById('toggleBebidas');
    const statusMsg = document.getElementById('statusMsg');

    // Carrega e sincroniza o estado atual do banco de dados
    onValue(bebidasRef, (snapshot) => {
      const valor = snapshot.val();
      checkbox.checked = valor !== false;
    });

    // Atualiza o Firebase ao alternar a caixa
    checkbox.addEventListener('change', (e) => {
      const status = e.target.checked;
      set(bebidasRef, status)
        .then(() => {
          statusMsg.style.color = status ? "green" : "red";
          statusMsg.textContent = `Bebidas ${status ? 'ATIVADAS' : 'DESATIVADAS'} no cardápio!`;
          setTimeout(() => statusMsg.textContent = '', 3000);
        })
        .catch((err) => {
          alert('Erro ao salvar no Firebase: ' + err.message);
        });
    });
  </script>
</body>
</html>
