<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Digital</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #fafafa; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #333; }
    .categoria { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .categoria h2 { margin-top: 0; color: #e63946; border-bottom: 2px solid #f1f1f1; padding-bottom: 8px; }
    .item { display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; padding: 10px 0; }
    .item:last-child { border-bottom: none; }
    .item-nome { font-weight: bold; }
    .item-desc { font-size: 13px; color: #666; }
    .item-preco { font-weight: bold; color: #2a9d8f; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cardápio</h1>
    <div id="cardapio">Carregando cardápio...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ COLE AQUI AS MESMAS CREDENCIAIS DO FIREBASE CONSOLE
   const firebaseConfig = {
  apiKey: "AIzaSyCHQhXMtPfkD9j4KCJPPjgk1c_eRZe3WHA",
  authDomain: "churrasco-bom-sabor.firebaseapp.com",
  projectId: "churrasco-bom-sabor",
  storageBucket: "churrasco-bom-sabor.firebasestorage.app",
  messagingSenderId: "608833389532",
  appId: "1:608833389532:web:3cfed1e270553cc9030519"
};


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Escuta o banco de dados em tempo real
    onValue(ref(db), (snapshot) => {
      const dados = snapshot.val();
      const container = document.getElementById('cardapio');
      container.innerHTML = '';

      if (!dados) {
        container.innerHTML = '<p>Nenhum item cadastrado no cardápio.</p>';
        return;
      }

      const bebidasAtivas = dados.configuracoes ? dados.configuracoes.bebidasAtivas : true;
      const categorias = dados.categorias || [];

      categorias.forEach(cat => {
        // Se a categoria for "bebidas" e o status for falso, ela é ignorada
        if (cat.id === 'bebidas' && !bebidasAtivas) {
          return;
        }

        let html = `<div class="categoria"><h2>${cat.nome}</h2>`;
        
        cat.itens.forEach(item => {
          html += `
            <div class="item">
              <div>
                <div class="item-nome">${item.nome}</div>
                <div class="item-desc">${item.descricao || ''}</div>
              </div>
              <div class="item-preco">R$ ${item.preco.toFixed(2)}</div>
            </div>
          `;
        });

        html += `</div>`;
        container.innerHTML += html;
      });
    });
  </script>
</body>
</html>
